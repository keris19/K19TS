<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K19TS · Torneo en vivo</title><style>:root{font-family:system-ui;color-scheme:dark;background:#0c1119;color:#f4f4f2}*{box-sizing:border-box}body{margin:0}header{background:#151c27;padding:22px 5vw;border-bottom:1px solid #384459}main{max-width:950px;padding:18px;margin:auto}h1{margin:0}h2{color:#edc363}p{color:#c5ccd7}.card{padding:18px;margin:13px 0;border:1px solid #374257;border-radius:14px;background:#171f2b}.match{padding:12px;border-bottom:1px solid #374257}.row{display:flex;justify-content:space-between;gap:14px}.small{color:#a9b9cd;font-size:13px}.tabs{display:flex;gap:10px}button,input{padding:10px;background:#27384b;color:white;border:1px solid #536277;border-radius:10px;font:inherit}button{cursor:pointer}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:9px;border-bottom:1px solid #374257}a{color:#edc363}.hidden{display:none}</style></head><body><header><h1>⚔️ K19TS · LIVE</h1><p>Emparejamientos y clasificación pública</p></header><main><div class="card" id="status">Conectando al torneo...</div><h2 id="name"></h2><div class="tabs"><button id="showmatches">Emparejamientos</button><button id="showranks">Clasificación</button></div><div id="matches" class="card"></div><div id="ranks" class="card hidden"></div><p class="small">Actualización automática cada 5 segundos. Solo el organizador puede editar resultados.</p></main><script src="config.js"></script><script>
(()=>{'use strict';const $=s=>document.getElementById(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\x27':'&#39;'}[c]));const slug=new URLSearchParams(location.search).get('torneo');const cfg=window.K19TS_CONFIG||{};if(!slug||!cfg.url||!cfg.key){$('status').textContent='Falta configurar config.js con la URL y clave pública de Supabase, o falta ?torneo=codigo';return}
const url=cfg.url.replace(/\/$/,'')+'/rest/v1/tournaments?slug=eq.'+encodeURIComponent(slug)+'&select=state';let state=null;
function draw(){const d=state,ps=Object.fromEntries(d.players.map(p=>[p.id,p.name])),round=d.rounds.length?d.rounds.at(-1):[];$('name').textContent=d.title+' · '+d.format;
$('matches').innerHTML='<h2>Ronda '+d.rounds.length+' de '+d.max+'</h2>'+(round.length?round.map((m,i)=>'<div class="match"><div class="small">Mesa '+(i+1)+'</div><div class="row"><strong>'+esc(ps[m.a]||'?')+'</strong><span>VS</span><strong>'+esc(m.b?ps[m.b]:'BYE')+'</strong></div><p>'+(m.result?(m.b?('Resultado: '+(m.result==='A'?'WIN / LOSE':m.result==='B'?'LOSE / WIN':'DRAW / DRAW')+' · '+m.sa+' - '+m.sb):'WIN por BYE'):'Pendiente')+'</p></div>').join(''):'Sin emparejamientos');
const st=Object.fromEntries(d.players.map(p=>[p.id,{...p,pts:0,w:0,dr:0,l:0,gw:0,gl:0,opp:[]}]));
for(const r of d.rounds)for(const m of r){if(!m.result)continue;const a=st[m.a],b=st[m.b];if(!a)continue;if(!b){a.w++;a.pts+=3;continue}a.opp.push(b.id);b.opp.push(a.id);a.gw+=m.sa||0;a.gl+=m.sb||0;b.gw+=m.sb||0;b.gl+=m.sa||0;if(m.result==='A'){a.w++;a.pts+=3;b.l++}else if(m.result==='B'){b.w++;b.pts+=3;a.l++}else{a.dr++;b.dr++;a.pts++;b.pts++}}
for(const s of Object.values(st)){const played=s.w+s.dr+s.l;s.mwp=played?s.pts/played/3:0;s.gwp=s.gw+s.gl?s.gw/(s.gw+s.gl):0}for(const s of Object.values(st)){s.omw=s.opp.length?s.opp.reduce((n,id)=>n+Math.max(1/3,st[id].mwp),0)/s.opp.length:0;s.ogw=s.opp.length?s.opp.reduce((n,id)=>n+Math.max(1/3,st[id].gwp),0)/s.opp.length:0}
const ranked=Object.values(st).sort((a,b)=>b.pts-a.pts||b.omw-a.omw||b.gwp-a.gwp||b.ogw-a.ogw);$('ranks').innerHTML='<h2>Clasificación</h2><div style="overflow:auto"><table><tr><th>#</th><th>Jugador</th><th>PTS</th><th>W</th><th>D</th><th>L</th><th>OMW</th></tr>'+ranked.map((s,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(s.name)+'</td><td>'+s.pts+'</td><td>'+s.w+'</td><td>'+s.dr+'</td><td>'+s.l+'</td><td>'+(s.omw*100).toFixed(1)+'%</td></tr>').join('')+'</table></div>'}
async function refresh(){try{let r=await fetch(url,{headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key}});if(!r.ok)throw Error('HTTP '+r.status);let rows=await r.json();if(!rows.length)throw Error('No existe el torneo '+slug);state=rows[0].state;draw();$('status').textContent='● En vivo · Actualizado '+new Date().toLocaleTimeString()}catch(e){$('status').textContent='No se pudo actualizar: '+e.message}}
$('showmatches').onclick=()=>{$('matches').classList.remove('hidden');$('ranks').classList.add('hidden')};$('showranks').onclick=()=>{$('ranks').classList.remove('hidden');$('matches').classList.add('hidden')};refresh();setInterval(refresh,5000)
})();
</script></body></html>
